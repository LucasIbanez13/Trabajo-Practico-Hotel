<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Reservas - Inicio de Sesión</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="body--index">
    <main>
      <section class="form-section" id="form-section">
        <div class="form-container">
                <h1 class="header__title header_title--auth">Inicio de Sesión</h1>
          <form id="form-login" class="crear__form">
            <div class="crear__form-group">
              <label class="crear__label">Email</label>
              <input id="email-login" class="crear__input" />
            </div>
            <div class="crear__form-group">
              <label class="crear__label">Contraseña</label>
              <input id="password-login" type="password" class="crear__input" />
            </div>
            <button id="btn-login" class="crear__btn-guardar">Iniciar Sesión</button>
          </form>

          <form id="form-register" class="crear__form hidden">
            <div class="crear__form-group">
              <label class="crear__label">Nombre</label>
              <input id="name-register" class="crear__input" />
            </div>
            <div class="crear__form-group">
              <label class="crear__label">Email</label>
              <input id="email-register" class="crear__input" />
            </div>
            <div class="crear__form-group">
              <label class="crear__label">Contraseña</label>
              <input id="password-register" type="password" class="crear__input" />
            </div>
            <button id="btn-register" class="crear__btn-guardar">Registrarme</button>
          </form>
          <span id="switch-text">No tienes una cuenta?</span>
          <button type="button" id="switch-form">Registrarte</button>
        </div>
      </section>
    </main>
    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
